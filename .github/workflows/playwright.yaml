name: Playwright Tests
on:
  workflow_dispatch: 

defaults:
  run:
    working-directory: ./playwright

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
    - uses: actions/checkout@v4
    
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
        
    - name: Install dependencies
      run: npm install
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Run Playwright tests
      env:
        SAUCEDEMO_PASSWORD: ${{ secrets.SAUCEDEMO_PASSWORD }}
      run: npx playwright test --reporter=github,html,json

    # --- DEBUG STEP ---
    - name: Debug File Locations
      if: ${{ !cancelled() }}
      run: |
        echo "=== Current Working Directory ==="
        pwd
        echo "=== Listing Repository Root Layout ==="
        cd ..
        ls -R
    # ------------------

    - name: Generate Summary Report
      if: ${{ !cancelled() }}
      uses: daun/playwright-report-summary@v4
      with:
        report-file: playwright/results.json
        job-summary: true

    - name: Upload HTML Artifact
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: playwright/playwright-report/
        retention-days: 30
